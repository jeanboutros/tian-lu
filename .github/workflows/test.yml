name: test

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  lint-and-unit:
    name: lint + unit (stubbed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck + bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
      - name: make lint
        run: make lint
      - name: make test
        run: make test

  twin:
    name: end-to-end Lima twin
    runs-on: macos-14
    # Only run the slow (~20 min) twin when the installer, harness, tests, or
    # build wiring changes — skip on docs-only pushes. Always runs on PRs.
    # github.event.commits.*.modified is the push payload; head_commit is the
    # fallback for single-commit pushes / force-pushes. Both are absent on PRs
    # (gated by the first clause).
    if: |
      github.event_name == 'pull_request' ||
      contains(toJson(github.event.commits.*.modified), 'setup-floci.sh') ||
      contains(toJson(github.event.commits.*.modified), 'mock-server/') ||
      contains(toJson(github.event.commits.*.modified), 'tests/') ||
      contains(toJson(github.event.commits.*.modified), 'Makefile') ||
      contains(toJson(github.event.head_commit.modified), 'setup-floci.sh') ||
      contains(toJson(github.event.head_commit.modified), 'mock-server/') ||
      contains(toJson(github.event.head_commit.modified), 'tests/') ||
      contains(toJson(github.event.head_commit.modified), 'Makefile')
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + lima + qemu
        run: |
          brew install bats-core lima qemu
      - name: make twin-test (--fresh --destroy)
        run: make twin-test TWIN_FLAGS="--fresh --reboot-test --destroy"
        continue-on-error: true
        id: twin
      - name: Locate latest evidence dir
        id: evidence
        if: always()
        run: |
          dir="$(ls -dt mock-server/evidence/*/ 2>/dev/null | head -1)"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
      - name: Upload evidence bundle
        if: always() && steps.evidence.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: twin-evidence
          path: ${{ steps.evidence.outputs.dir }}
      - name: Fail the job if the twin failed
        if: steps.twin.outcome != 'success'
        run: exit 1