name: test

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  lint-and-unit:
    name: lint + unit (stubbed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck + bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
      - name: make lint
        run: make lint
      - name: make test
        run: make test
